<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Social Meta Tags -->
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #15325b;
      --accent: #1e6b47;
      --gold: #c59b27;
      --text: #1f2937;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      line-height: 1.75;
      padding: 0 1rem 4rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top Nav */
    nav.academic-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }
    .nav-brand {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 1.25rem;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 500;
      font-size: 0.92rem;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: var(--primary);
    }

    /* Card Container */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.25rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 12px rgba(21, 50, 91, 0.04);
    }

    h1, h2, h3, h4 {
      font-family: 'Lora', serif;
      color: var(--primary);
    }

    .abstract-quote {
      background: #f7faf8;
      border-left: 4px solid var(--accent);
      padding: 1.25rem 1.4rem;
      border-radius: 0 8px 8px 0;
      margin: 1.25rem 0;
      font-size: 0.95rem;
    }

    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #0077b5;
      color: #fff;
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .portal-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 1rem;
    }
    .portal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
    }
    .portal-item:hover {
      background: #ffffff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .portal-item strong { color: var(--primary); }
    .portal-tag {
      font-size: 0.8rem;
      color: var(--muted);
      background: #edf2f7;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="academic-nav">
      <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/research' | relative_url }}">Research Article</a>
        <a href="mailto:{{ site.email }}">Contact</a>
      </div>
    </nav>

    {{ content }}

    <footer>
      <p>© {{ 'now' | date: "%Y" }} {{ site.title }} • Academic Portfolio</p>
      <p>İstanbul Beykent University Alumni</p>
    </footer>
  </div>
</body>
</html>
