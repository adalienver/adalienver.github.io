<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const PROJECT_URL = "https://kigjblhzauhyagrckkwj.supabase.co";
    const PUBLISHABLE_KEY = "sb_publishable_LsuTpgVDAANBu1VB0Qh69Q_ENRCJKy0";

    const greeting = document.getElementById("user-greeting");
    const statusMsg = document.getElementById("status-msg");
    const player = document.getElementById("audio-player");
    const logoutBtn = document.getElementById("logout-btn");

    async function loadSecurePodcast() {
      try {
        if (!window.supabase) {
          statusMsg.textContent = "Supabase kütüphanesi yüklenemedi.";
          return;
        }

        const client = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);

        // 1. Oturum kontrolü
        const { data: { session }, error: sessionError } = await client.auth.getSession();

        if (sessionError || !session) {
          window.location.href = "/login.html";
          return;
        }

        greeting.textContent = "Öğrenci: " + session.user.email;

        // 2. Güvenli ses linki oluşturma (60 dakika geçerli)
        const { data, error } = await client
          .storage
          .from('subtitle edit sunum')
          .createSignedUrl('sunum.mp3', 3600);

        if (error) {
          console.error("Storage hatası:", error);
          statusMsg.textContent = "Hata: " + (error.message || "Dosyaya erişilemedi.");
          statusMsg.dataset.state = "error";
          return;
        }

        if (data && data.signedUrl) {
          statusMsg.style.display = "none";
          player.src = data.signedUrl;
          player.style.display = "block";
        }
      } catch (err) {
        console.error("Beklenmeyen hata:", err);
        statusMsg.textContent = "Bağlantı hatası: " + err.message;
        statusMsg.dataset.state = "error";
      }
    }

    logoutBtn.addEventListener("click", async () => {
      const client = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);
      await client.auth.signOut();
      window.location.href = "/login.html";
    });

    loadSecurePodcast();
  </script>
