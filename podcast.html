<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Özel Podcast & Sunum Alanı</title>

  <style>
    :root {
      --background: #f5f4ef;
      --ink: #182921;
      --muted: #626b65;
      --green: #225c45;
      --border: #d9ded8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    .player-card {
      background: white;
      width: 100%;
      max-width: 520px;
      padding: 40px 32px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(24, 41, 33, 0.08);
      text-align: center;
    }

    .icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: #edf4ee;
      color: var(--green);
      font-size: 26px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    .user-greeting {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
      word-break: break-all;
    }

    .audio-wrapper {
      margin: 24px 0;
      background: #fbfbf9;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    audio {
      width: 100%;
      display: block;
      outline: none;
    }

    .status-msg {
      font-size: 14px;
      margin: 12px 0;
      color: var(--muted);
    }

    .status-msg[data-state="error"] {
      color: #a52c2c;
      font-weight: 500;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #fce8e8;
      color: #a52c2c;
    }
  </style>
</head>
<body>

  <main class="player-card">
    <div class="icon-badge">♫</div>
    <h1>Özel Ders & Podcast</h1>
    <p id="user-greeting" class="user-greeting">Oturum kontrol ediliyor…</p>

    <div class="audio-wrapper">
      <p id="status-msg" class="status-msg">Ses kaydı hazırlanıyor…</p>
      <audio id="audio-player" controls style="display: none;"></audio>
    </div>

    <button id="logout-btn" class="logout-btn" type="button">Çıkış Yap</button>
  </main>

  <!-- Supabase Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const PROJECT_URL = "https://kigjblhzauhyagrckkwj.supabase.co";
    const PUBLISHABLE_KEY = "sb_publishable_LsuTpgVDAANBu1VB0Qh69Q_ENRCJKy0";

    const greeting = document.getElementById("user-greeting");
    const statusMsg = document.getElementById("status-msg");
    const player = document.getElementById("audio-player");
    const logoutBtn = document.getElementById("logout-btn");

    async function loadSecurePodcast() {
      try {
        if (!window.supabase) {
          statusMsg.textContent = "Supabase kütüphanesi yüklenemedi. Sayfayı yenileyin.";
          statusMsg.dataset.state = "error";
          return;
        }

        const client = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);

        // 1. Öğrenci oturum kontrolü
        const { data: { session }, error: sessionError } = await client.auth.getSession();

        if (sessionError || !session) {
          window.location.href = "/login.html";
          return;
        }

        greeting.textContent = "Giriş yapıldı: " + session.user.email;

        // 2. 60 dakikalık imzalı URL üretimi
        const { data, error } = await client
          .storage
          .from('subtitle edit sunum')
          .createSignedUrl('sunum.mp3', 3600);

        if (error) {
          console.error("Storage Hatası:", error);
          statusMsg.textContent = "Hata: " + (error.message || "Dosyaya ulaşılamadı.");
          statusMsg.dataset.state = "error";
          return;
        }

        if (data && data.signedUrl) {
          statusMsg.style.display = "none";
          player.src = data.signedUrl;
          player.style.display = "block";
        }
      } catch (err) {
        console.error("Genel Hata:", err);
        statusMsg.textContent = "Bağlantı hatası: " + err.message;
        statusMsg.dataset.state = "error";
      }
    }

    logoutBtn.addEventListener("click", async () => {
      const client = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);
      await client.auth.signOut();
      window.location.href = "/login.html";
    });

    loadSecurePodcast();
  </script>
</body>
</html>
